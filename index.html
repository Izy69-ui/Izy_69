<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#ece5dd;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.phone{

    width:400px;
    max-width:100%;
    height:760px;

    background:white;

    border-radius:22px;

    overflow:hidden;

    box-shadow:0 20px 45px rgba(0,0,0,.25);

    display:flex;

    flex-direction:column;

}

.header{

    background:#128C7E;

    color:white;

    display:flex;

    align-items:center;

    padding:14px;

}

.avatar{

    width:52px;
    height:52px;

    border-radius:50%;

    object-fit:cover;

    margin-right:12px;

}

.header h2{

    font-size:18px;

}

.status{

    font-size:13px;

    opacity:.9;

}

.chat{

    flex:1;

    background:#efeae2;

    padding:15px;

    overflow:auto;

}

.message{

    display:inline-block;

    max-width:80%;

    padding:11px 15px;

    border-radius:16px;

    margin-bottom:15px;

    font-size:15px;

}

.left{

    background:white;

}

.right{

    background:#DCF8C6;

    float:right;

    clear:both;

}

.reply{

    display:flex;

    justify-content:center;

    margin-top:10px;

}

.reply button{

    background:#25D366;

    color:white;

    border:none;

    border-radius:30px;

    padding:12px 25px;

    cursor:pointer;

    font-weight:600;

    font-size:15px;

}

.photo{

    display:none;

    margin-top:15px;

    cursor:pointer;

}

.photo img{

    width:220px;

    border-radius:15px;

    filter:blur(10px);

    transition:.3s;

}

.overlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    justify-content:center;

    align-items:center;

    padding:20px;

}

.modal{

    background:white;

    border-radius:18px;

    max-width:350px;

    width:100%;

    padding:25px;

    text-align:center;

}

.modal h2{

    margin-bottom:12px;

}

.modal p{

    color:#555;

    line-height:1.5;

    margin-bottom:20px;

}

.modal a{

    display:block;

    background:#25D366;

    color:white;

    text-decoration:none;

    padding:15px;

    border-radius:30px;

    font-weight:bold;

}

.footer{

    background:#f0f2f5;

    padding:12px;

    text-align:center;

    color:#777;

    font-size:13px;

}

</style>

</head>

<body>

<div class="phone">

<div class="header">

<img class="avatar"
src="https://preview.redd.it/86v0rpuu96e71.jpg?width=640&crop=smart&auto=webp&s=866a1c4b7c3c84f0ac1e0d3a02d235a937b0a6ed"
alt="Perfil">

<div>

<h2>Marjorie Schultz</h2>

<div class="status">online</div>

</div>

</div>

<div class="chat" id="chat">

<div class="message left">

👋 Hallo Baby.

</div>

<br>

<div class="message left">

Möchtest du mein heißes Foto sehen?

</div>

<div class="reply">

<button onclick="mostrarFoto()">
Ja,Vorschau anzeigen
</button>

</div>

<div class="photo" id="foto">

<img
onclick="abrirModal()"
src="https://fapello.com/content/i/z/izzy-xx/1000/izzy-xx_0500_300px.jpg"
alt="Vista previa">

</div>

</div>

<div class="footer">

Chat nur für Erwachsene ab 18 Jahren

</div>

</div>

<div class="overlay" id="overlay">

<div class="modal">

<h2>🔓 Zugriff erhalten</h2>

<p>

Nur für Erwachsene. Kostenlos registrieren, E-Mail bestätigen und Foto freischalten.

</p>

<a href="https://trustedoffers.pro/a/lYlrYTX5NKS1JOl">

registrieren

</a>

</div>

</div>

<script>

function mostrarFoto(){

document.getElementById("foto").style.display="block";

}

function abrirModal(){

document.getElementById("overlay").style.display="flex";

}

document.getElementById("overlay").onclick=function(e){

if(e.target===this){

this.style.display="none";

}

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vista previa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:#ece5dd;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:15px;

}


/* CONTENEDOR */

.phone{

    width:100%;

    max-width:420px;

    height:90vh;

    max-height:780px;

    min-height:550px;

    background:white;

    border-radius:22px;

    overflow:hidden;

    box-shadow:0 20px 45px rgba(0,0,0,.25);

    display:flex;

    flex-direction:column;

}



/* HEADER */

.header{

    background:#128C7E;

    color:white;

    display:flex;

    align-items:center;

    padding:12px 15px;

    flex-shrink:0;

}


.avatar{

    width:50px;

    height:50px;

    border-radius:50%;

    object-fit:cover;

    margin-right:12px;

}


.header h2{

    font-size:17px;

}


.status{

    font-size:13px;

    opacity:.9;

}



/* CHAT */

.chat{

    flex:1;

    background:#efeae2;

    padding:15px;

    overflow-y:auto;

    overflow-x:hidden;

}



.message{

    display:block;

    width:max-content;

    max-width:85%;

    padding:10px 14px;

    border-radius:16px;

    margin-bottom:12px;

    font-size:15px;

    line-height:1.4;

    word-wrap:break-word;

}



.left{

    background:white;

}


.right{

    background:#DCF8C6;

    margin-left:auto;

}



/* BOTON */

.reply{

    display:flex;

    justify-content:center;

    margin-top:10px;

}



.reply button{

    width:100%;

    max-width:280px;

    background:#25D366;

    color:white;

    border:none;

    border-radius:30px;

    padding:14px 20px;

    cursor:pointer;

    font-weight:600;

    font-size:15px;

}



.reply button:active{

    transform:scale(.96);

}



/* FOTO */

.photo{

    display:none;

    text-align:center;

    margin-top:20px;

}


.photo img{

    width:100%;

    max-width:230px;

    border-radius:15px;

    filter:blur(10px);

    cursor:pointer;

}



/* MODAL */

.overlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    justify-content:center;

    align-items:center;

    padding:20px;

    z-index:99;

}



.modal{

    background:white;

    width:100%;

    max-width:360px;

    border-radius:20px;

    padding:25px;

    text-align:center;

    animation:zoom .25s ease;

}


@keyframes zoom{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}



.modal h2{

    font-size:22px;

    margin-bottom:12px;

}



.modal p{

    color:#555;

    font-size:14px;

    line-height:1.5;

    margin-bottom:20px;

}



.modal a{

    display:block;

    background:#25D366;

    color:white;

    text-decoration:none;

    padding:15px;

    border-radius:30px;

    font-weight:bold;

}



/* FOOTER */

.footer{

    background:#f0f2f5;

    padding:12px;

    text-align:center;

    color:#777;

    font-size:12px;

}



/* MOVILES PEQUEÑOS */

@media(max-width:380px){


.phone{

height:95vh;

border-radius:15px;

}


.header h2{

font-size:15px;

}


.message{

font-size:14px;

}


}



/* ESCRITORIO */

@media(min-width:768px){


.phone{

height:760px;

}


}

</style>

</head>


<body>


<div class="phone">


<div class="header">


<img class="avatar"
src="https://preview.redd.it/86v0rpuu96e71.jpg?width=640&crop=smart&auto=webp&s=866a1c4b7c3c84f0ac1e0d3a02d235a937b0a6ed">


<div>

<h2>Marjorie Schultz</h2>

<div class="status">online</div>

</div>


</div>



<div class="chat">


<div class="message left">

👋 Hallo Baby.

</div>



<div class="message left">

Möchtest du mein heißes Foto sehen?

</div>



<div class="reply">

<button onclick="mostrarFoto()">

Ja, Vorschau anzeigen

</button>

</div>



<div class="photo" id="foto">


<img onclick="abrirModal()"

src="https://fapello.com/content/i/z/izzy-xx/1000/izzy-xx_0500_300px.jpg">


</div>


</div>



<div class="footer">

Chat nur für Erwachsene ab 18 Jahren

</div>


</div>



<div class="overlay" id="overlay">


<div class="modal">


<h2>🔓 Zugriff erhalten</h2>


<p>

Nur für Erwachsene. Kostenlos registrieren, E-Mail bestätigen und Foto freischalten.

</p>



<a href="https://clicknlook.site/a/73mP3FZP9OfNYMY">

Registrieren

</a>


</div>


</div>




<script>


function mostrarFoto(){

document.getElementById("foto").style.display="block";

}



function abrirModal(){

document.getElementById("overlay").style.display="flex";

}



document.getElementById("overlay").onclick=function(e){

if(e.target===this){

this.style.display="none";

}

}



</script>


</body>
</html>

*{

    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(
        -45deg,
        #0f0f0f,
        #240046,
        #5a189a,
        #ff006e
    );
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:100%;
    max-width:500px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border-radius:25px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 0 40px rgba(255,0,110,.4);
}

.hero-image{
    width:100%;
    height:360px;
    object-fit:cover;
    display:block;
}

.content{
    padding:30px;
    text-align:center;
    color:white;
}

.online{
    color:#39ff14;
    font-size:20px;
    font-weight:700;
    margin-bottom:15px;
    animation:neonPulse 1.5s infinite;
    text-shadow:
    0 0 5px #39ff14,
    0 0 10px #39ff14,
    0 0 20px #39ff14,
    0 0 40px #39ff14;
}

.online::before{
    content:"🟢 ";
}

@keyframes neonPulse{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.6;
    }
}

h1{
    font-size:34px;
    margin-bottom:15px;
    text-shadow:
    0 0 10px #ff006e,
    0 0 20px #ff006e;
}

.message{

}

.register-btn{

    color:white;
    font-size:22px;
    font-weight:800;
    padding:18px;
    border-radius:18px;

    background:linear-gradient(
        45deg,
        #ff00ff,
        #00ffff,
        #39ff14,
        #ffff00,
        #ff00ff
    );

    background-size:400% 400%;

    animation:
        rainbow 4s linear infinite,
        bounce 1.2s infinite;

    box-shadow:
        0 0 10px #ff00ff,
        0 0 20px #ff00ff,
        0 0 40px #00ffff,
        0 0 60px #39ff14;
}

@keyframes rainbow{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

.notice{
    margin-top:20px;
    font-size:14px;
    color:#ddd;
    line-height:1.5;
}

.footer{
    margin-top:15px;
    font-size:12px;
    color:#aaa;
}

</style>
</head>
